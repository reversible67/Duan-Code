[project]
name = "react-ai-agent"
version = "0.1.0"
authors = [
  { name="端", email="w_duan2001@163.com" }
]
description = "A ReAct AI agent with tool calling, file operations and terminal command execution"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "click>=8.0.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"